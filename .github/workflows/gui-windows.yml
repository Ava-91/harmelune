name: Windows Tkinter GUI tests

on:
  pull_request:
    paths:
      - "app.py"
      - "harmelune/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/gui-windows.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "harmelune/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/gui-windows.yml"
  workflow_dispatch:

jobs:
  tkinter-gui:
    name: Native Tkinter integration (Windows / Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Configure Tcl/Tk libraries
        shell: pwsh
        run: |
          $pythonRoot = $env:pythonLocation
          if (-not $pythonRoot) {
            throw "actions/setup-python did not provide the Python installation path"
          }
          $tclLibrary = Join-Path $pythonRoot "tcl\tcl8.6"
          $tkLibrary = Join-Path $pythonRoot "tcl\tk8.6"
          if (-not (Test-Path -LiteralPath (Join-Path $tclLibrary "init.tcl"))) {
            throw "The configured Python installation is missing Tcl's init.tcl: $tclLibrary"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $tkLibrary "tk.tcl"))) {
            throw "The configured Python installation is missing Tk's tk.tcl: $tkLibrary"
          }
          "TCL_LIBRARY=$tclLibrary" >> $env:GITHUB_ENV
          "TK_LIBRARY=$tkLibrary" >> $env:GITHUB_ENV

      - name: Verify Tcl/Tk runtime
        shell: pwsh
        run: |
          python -c "import tkinter; print('Tkinter module:', tkinter.__file__); print('Tcl version:', tkinter.Tcl().eval('info patchlevel'))"
          python -c "import sys, pathlib; root = pathlib.Path(sys.base_prefix) / 'tcl'; print('Tcl root:', root); print('init.tcl found:', list(root.rglob('init.tcl'))[:5])"

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Exercise native comparison workspace widgets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pytest -vv tests/test_tkinter_integration.py --junitxml=artifacts/tkinter-gui-results.xml
        env:
          PYTHONFAULTHANDLER: "1"

      - name: Upload GUI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkinter-gui-test-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tkinter-gui-results.xml
          if-no-files-found: warn
