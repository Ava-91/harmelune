name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    uses: Ava-91/Ava-91/.github/workflows/reusable-python.yml@main
    with:
      runner: ${{ matrix.runner }}
      python-version: "3.11"
      install-command: "python -m pip install -r requirements-dev.txt"
      lint-command: "python -m compileall -q harmelune"
      test-command: "python -m pytest -q"
