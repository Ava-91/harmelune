name: Desktop shell

on:
  pull_request:
    paths:
      - "desktop/**"
      - "harmelune/**"
      - "harmelune-sidecar.spec"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "harmelune/**"
      - "harmelune-sidecar.spec"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/desktop.yml"

jobs:
  desktop-shell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the restricted Python sidecar
        run: |
          python -m pytest -q
          python -m PyInstaller --clean --noconfirm harmelune-sidecar.spec
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/harmelune-sidecar.exe desktop/src-tauri/binaries/harmelune-sidecar.exe

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Type-check and build frontend
        working-directory: desktop
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build the actual desktop executable for WebDriver tests
        working-directory: desktop
        run: npm run tauri -- build --debug --no-bundle

      - name: Install native Tauri WebDriver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE\\.cargo\\bin\\msedgedriver-tool.exe"
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\\bin"
          "$cargoBin" >> $env:GITHUB_PATH
          if (-not (Get-Command msedgedriver -ErrorAction SilentlyContinue)) {
            $candidate = Get-ChildItem -Path $PWD,$cargoBin -Filter msedgedriver.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $candidate.DirectoryName >> $env:GITHUB_PATH }
            else { throw "Microsoft Edge WebDriver was not installed or added to PATH." }
          }
          & "$cargoBin\\tauri-driver.exe" --version
          msedgedriver --version
          python -c "import selenium; print('Selenium', selenium.__version__)"

      - name: Exercise the real Tauri desktop user journey
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\\tauri-e2e | Out-Null
          python -m pytest -vv tests/e2e_tauri/test_desktop_e2e.py --junitxml=artifacts\\tauri-e2e\\results.xml
        env:
          HARMELUNE_TAURI_E2E: "1"
          HARMELUNE_TAURI_APP: desktop\\src-tauri\\target\\debug\\harmelune-desktop.exe
          HARMELUNE_E2E_ARTIFACTS: artifacts\\tauri-e2e
          PYTHONFAULTHANDLER: "1"

      - name: Upload native desktop test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tauri-e2e
          if-no-files-found: warn
