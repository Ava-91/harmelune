name: Desktop shell

on:
  pull_request:
    paths:
      - "desktop/**"
      - "harmelune/**"
      - "harmelune-sidecar.spec"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "harmelune/**"
      - "harmelune-sidecar.spec"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/desktop.yml"

jobs:
  desktop-shell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the restricted Python sidecar
        run: |
          python -m pytest -q
          python -m PyInstaller --clean --noconfirm harmelune-sidecar.spec
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/harmelune-sidecar.exe desktop/src-tauri/binaries/harmelune-sidecar.exe

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Type-check and build frontend
        working-directory: desktop
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
