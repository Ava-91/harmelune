name: Nightly library integrity

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmelune-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Library health and recovery tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run library integrity and recovery tests
        run: |
          python -m pytest -q \
            tests/test_health.py \
            tests/test_scanner.py \
            tests/test_artwork_manager.py \
            tests/test_backup_verified.py \
            tests/test_backup_restore.py \
            tests/test_path_safety.py \
            tests/test_end_to_end_safety.py \
            --junitxml=integrity-results.xml
      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmelune-integrity-${{ matrix.os }}-${{ github.run_id }}
          path: integrity-results.xml
          if-no-files-found: warn
          retention-days: 30
